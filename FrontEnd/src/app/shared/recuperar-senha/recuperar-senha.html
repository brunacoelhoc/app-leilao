<app-modal titulo="Recuperar senha" [largura]="460" (fechar)="fechar.emit()">
  <ol class="etapas" aria-label="Etapas da recuperação">
    <li [class.ativa]="etapa() === 'email'" [attr.aria-current]="etapa() === 'email' ? 'step' : null">1. E-mail</li>
    <li [class.ativa]="etapa() === 'redefinir'" [attr.aria-current]="etapa() === 'redefinir' ? 'step' : null">2. Código e nova senha</li>
  </ol>

  @switch (etapa()) {
    @case ('email') {
      <form (ngSubmit)="pedirCodigo()">
        <div class="campo">
          <label for="rec-email">E-mail da sua conta</label>
          <input id="rec-email" name="email" type="email" [(ngModel)]="email" required autocomplete="email" placeholder="seuemail@exemplo.com" />
        </div>
        @if (erro()) { <p class="erro" role="alert">{{ erro() }}</p> }
        <div class="botoes">
          <button type="submit" class="primario" [disabled]="enviando()">{{ enviando() ? 'Enviando...' : 'Enviar código' }}</button>
          <button type="button" class="secundario" (click)="fechar.emit()">Cancelar</button>
        </div>
      </form>
    }
    @case ('redefinir') {
      <form (ngSubmit)="redefinir()">
        @if (aviso()) { <p role="status">{{ aviso() }}</p> }
        <div class="campo">
          <label for="rec-codigo">Código de 6 dígitos</label>
          <input id="rec-codigo" name="codigo" type="text" inputmode="numeric" maxlength="6" [(ngModel)]="codigo" required autocomplete="one-time-code" />
        </div>
        <div class="campo">
          <label for="rec-nova">Nova senha</label>
          <input id="rec-nova" name="nova" [type]="mostrar() ? 'text' : 'password'" [(ngModel)]="novaSenha" required autocomplete="new-password" />
          <small class="lista-vazia">Mínimo 8 caracteres, com maiúscula, minúscula, número e símbolo.</small>
        </div>
        <div class="campo">
          <label for="rec-conf">Confirmar nova senha</label>
          <input id="rec-conf" name="confirmar" [type]="mostrar() ? 'text' : 'password'" [(ngModel)]="confirmar" required autocomplete="new-password" />
        </div>
        <div class="campo-checkbox">
          <input id="rec-ver" name="ver" type="checkbox" [checked]="mostrar()" (change)="mostrar.set(!mostrar())" />
          <label for="rec-ver">Mostrar senhas digitadas</label>
        </div>
        @if (erro()) { <p class="erro" role="alert">{{ erro() }}</p> }
        <div class="botoes">
          <button type="submit" class="primario" [disabled]="enviando()">{{ enviando() ? 'Salvando...' : 'Redefinir senha' }}</button>
          <button type="button" class="secundario" (click)="etapa.set('email')">Voltar</button>
        </div>
      </form>
    }
  }
</app-modal>
