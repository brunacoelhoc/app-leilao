<div class="pagina-central">
  <div class="cartao cartao-auth">
    <h1>Criar conta</h1>
    <p class="subtitulo">Toda conta nova nasce como licitante. Um ADMIN pode promover depois.</p>

    <form (ngSubmit)="cadastrar()">
      <div class="campo">
        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text" [(ngModel)]="nome" required />
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" [(ngModel)]="email" required autocomplete="email" />
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <div class="campo-senha">
          <input
            id="senha"
            name="senha"
            [type]="mostrarSenha() ? 'text' : 'password'"
            [(ngModel)]="senha"
            required
            autocomplete="new-password"
          />
          <button
            type="button"
            class="olho"
            (click)="mostrarSenha.set(!mostrarSenha())"
            [attr.aria-label]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'"
          >
            {{ mostrarSenha() ? '🙈' : '👁' }}
          </button>
        </div>
        <small class="lista-vazia">Mínimo 8 caracteres, com maiúscula, minúscula, número e símbolo.</small>
      </div>

      <div class="campo-checkbox">
        <input id="termos" name="termos" type="checkbox" [(ngModel)]="aceiteTermos" required />
        <label for="termos">Li e aceito os termos de uso e a política de privacidade.</label>
      </div>

      @if (erro()) {
        <p class="erro">{{ erro() }}</p>
      }

      <div class="botoes">
        <button type="submit" class="primario" [disabled]="carregando()">
          {{ carregando() ? 'Criando...' : 'Criar conta' }}
        </button>
        <a routerLink="/login" class="secundario botao-como-link">Já tenho conta</a>
      </div>
    </form>
  </div>
</div>
